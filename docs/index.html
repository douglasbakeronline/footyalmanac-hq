<style>
:root{--bg:#120e0b;--panel:#1b1612;--panel2:#231c17;--line:#33291f;--txt:#f4ede4;--mut:#a39282;--acc:#f0b35a;--good:#5fd38d;--bad:#f07a7a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 "General Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#1a140f,#120e0b)}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo b{font:700 12px "JetBrains Mono",monospace;letter-spacing:.28em;color:var(--acc)}
.logo span{font-size:11px;color:var(--mut)}
.roster{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;white-space:nowrap;cursor:pointer;transition:border-color .2s}
.chip:hover{border-color:var(--acc)}
.av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#1a1208}
.st{width:7px;height:7px;border-radius:50%;background:var(--good)}
.st.busy{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.clock{text-align:right;white-space:nowrap}.clock .t{font:700 18px "JetBrains Mono",monospace}.clock .n{font-size:11px;color:var(--mut)}
button.cta{background:var(--acc);color:#2a1a08;border:0;border-radius:10px;padding:9px 14px;font:600 13px "General Sans";cursor:pointer;white-space:nowrap}
button.cta:disabled{opacity:.55;cursor:progress}
main{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
#stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a211a 0%,#120e0b 70%)}
#stage canvas{display:block}
.board{position:absolute;left:14px;top:14px;width:340px;max-height:calc(100% - 132px);display:flex;flex-direction:column;background:rgba(27,22,18,.94);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:6;backdrop-filter:blur(6px)}
.board:empty{display:none}.board header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.board header b{font:700 11px "General Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}.board header span{color:var(--mut);font-size:11px;flex:1}
.board header button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;font:600 11px "General Sans";padding:3px 7px;cursor:pointer}
.board .bl{overflow:auto;padding:2px 12px 8px}.board .pk{grid-template-columns:38px minmax(0,1fr) auto;padding:6px 0}.board .pk .lg{font-size:10.5px}
.board .sub,#briefCard .sub{font:700 10px "General Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 0 2px}
#briefCard .sub{margin:12px 0 4px;color:#f0b35a}
.board.min .bl{display:none}.board .dsw{display:flex;gap:4px;padding:8px 12px 0}.board .dsw button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:6px;font:600 11px "General Sans";padding:4px 0;cursor:pointer}.board .dsw button.on{color:var(--txt);border-color:var(--acc)}
.board.min .dsw{display:none}
@media(max-width:980px){.board{left:8px;top:8px;right:8px;width:auto;max-height:calc(100% - 150px)}}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);background:#120e0bdd;border:1px solid #ffffff22;color:#fff;font-size:11px;font-weight:600;padding:2px 7px 2px 5px;border-radius:6px;display:flex;align-items:center;gap:5px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.rtag{position:absolute;transform:translate(0,-50%);display:flex;align-items:center;gap:5px;font:700 9.5px "General Sans";letter-spacing:.12em;text-transform:uppercase;color:#f4ece0;background:#120e0bb3;border:1px solid #ffffff1f;border-radius:999px;padding:2px 8px 2px 6px;white-space:nowrap;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
.rtag i{width:6px;height:6px;border-radius:50%}.rtag:hover{border-color:var(--acc)}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.tag.busy i{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.tag.talk{background:var(--acc);color:#1a1208}
.bubble{position:absolute;width:280px;transform:translate(-50%,calc(-100% - 34px));background:#fffaf2;color:#251b12;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.4;box-shadow:0 10px 30px #000a;pointer-events:none;animation:pop .25s ease-out}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fffaf2}
.bubble b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
@keyframes pop{from{opacity:0;transform:translate(-50%,calc(-100% - 24px)) scale(.95)}}
.hud{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
.hud button{background:#1b1612e6;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font:500 12px "General Sans";cursor:pointer}
.hud button:hover{border-color:var(--acc)}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#1b1612e6;border:1px solid var(--acc);border-radius:999px;padding:6px 16px;font-size:12px;display:none}
aside{min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs div{flex:1 0 auto;text-align:center;padding:11px 9px;cursor:pointer;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.tabs .on{color:var(--txt);box-shadow:inset 0 -2px var(--acc)}
.pane{flex:1;overflow:auto;padding:14px 16px;display:none}.pane.on{display:block}
.ask{display:flex;gap:6px;margin:4px 0 8px}.ask input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:500 13px "General Sans"}.ask input:focus{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.chips .sbtn{font-size:11px;padding:4px 8px}
.qa{margin:10px 0 14px}.qa .q{color:var(--mut);font-size:12px;margin-bottom:6px}.qa .a{background:var(--panel2);border:1px solid var(--line);border-left:3px solid #62d68f;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.pk{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line)}.pk:last-child{border-bottom:0}.pk .tm{color:var(--mut);font-variant-numeric:tabular-nums;font-size:11.5px}.pk .m b{color:var(--txt)}.pk .lg{grid-column:2/4;color:var(--mut);font-size:11px}.pk .cf{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ptag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--mut)}.ptag.l{color:#62d68f;border-color:#62d68f55}.ptag.w{color:#ffb86b;border-color:#ffb86b55}
.k{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.msg{margin:0 0 10px;padding:9px 11px;border-radius:10px;background:var(--panel2);border-left:3px solid;transition:background .3s}
.msg.now{background:#3a2c1c}
.msg .h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px}
.msg .h span{color:var(--mut);font-weight:500}
.msg p{margin:3px 0;font-size:12.5px}.msg p em{font-style:normal;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi div{font:700 22px "JetBrains Mono",monospace}.kpi small{color:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 16px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:11px}
td.n{text-align:right;font-family:"JetBrains Mono",monospace}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative}.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.tl{position:relative;margin:10px 0 0 8px;border-left:2px solid var(--line);padding-left:16px}
.tl .it{position:relative;margin-bottom:14px}.tl .it:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--mut)}
.tl .it.su:before{border-color:var(--acc);background:var(--acc)}.tl .it.next{background:#2b2118;border-radius:8px;padding:6px 8px;margin-left:-8px}
.tl .t{font:700 13px "JetBrains Mono",monospace;margin-right:8px}
.row{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}.row a{color:var(--txt);text-decoration:none}.row a:hover{color:var(--acc)}
.foot{padding:8px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:11px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#2a221b,#3a2f25,#2a221b);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}@keyframes sk{to{background-position:-200% 0}}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:58vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}.roster{display:none}}
button.cta.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.chipS{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.s-on{background:#1f3a2a;color:var(--good)}.s-risk{background:#3a2f1a;color:var(--acc)}.s-behind{background:#3a1f1f;color:var(--bad)}.s-nodata{background:#2a2a2a;color:var(--mut)}
.perk{display:flex;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);margin-bottom:8px;border:1px solid var(--line)}.perk.un{border-color:#5a4520}
.perk .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:#2e251c}
.perk b{font-size:13px}.perk p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.chatm{padding:8px 10px;background:var(--panel2);border-radius:10px;margin-bottom:8px;font-size:12.5px}.chatm .w{color:var(--mut);font-size:11px;margin-bottom:3px}
.sbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 10px;font:600 12px "General Sans";cursor:pointer}.sbtn:hover{border-color:var(--acc)}
ul.l{margin:4px 0 14px;padding-left:18px;font-size:12.5px}ul.l li{margin:4px 0}
.sm{display:none}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel);cursor:pointer}
.sc:hover{border-color:var(--acc)}.sc .nm{font-weight:600;font-size:13px}.sc .rl{font-size:11px;color:var(--mut)}.sc .kp{font-size:11px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;color:#1a1208}
.spark{display:block}.prof h3{margin:4px 0 2px;font-size:18px}.prof .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.prof .big{font:700 26px "JetBrains Mono",monospace}.prof .day{border-left:2px solid var(--line);padding:2px 0 6px 10px;margin-left:4px}.prof .day b{font-size:11px;color:var(--mut);font-weight:600}
.back{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 10px;font:500 12px "General Sans";cursor:pointer}
.orglog{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
@media(max-width:700px){
 html,body{height:auto}body{overflow:auto}
 main{display:block}
 #stage{height:calc(100svh - 50px)}

 header{padding:6px 10px;gap:8px}.logo svg{width:24px;height:24px}.logo span{display:none}.logo b{font-size:10px;letter-spacing:.16em}

.vpop.on{display:block}

body.full header,body.full aside{display:none}

@media(max-width:700px){.vbtn{padding:8px 10px}.vbtn .lbl{display:none}.viewbar{right:8px;top:8px}body.full .board{right:64px!important}}
</style>

function renderChats(){$("#chat").innerHTML=`<div class="k">Water cooler & canteen chatter</div><p style="color:var(--mut);font-size:12.5px;margin:6px 0 12px">Agents take breaks between work blocks, swap learnings and cheer each other on. Best bits feed the playback.</p>`+
 (CHATS.length?CHATS.slice(0,30).map(c=>`<div class="chatm"><div class="w">${fmt(c.time)} · ${c.spot||""}</div>${(c.lines||[]).map(l=>`<div><b style="color:${DEPT[AG[l.a]?.d]?.c||"#fff"}">${AG[l.a]?.name||l.a}:</b> ${l.t}</div>`).join("")}</div>`).join(""):"<p class='k'>No chats yet — first break coming up.</p>")}
async function loadChats(){try{const saved=await J("chats.json");CHATS=[...LOCALCHATS,...saved];renderChats()}catch(e){}}
function showAgent(id){const a=AG[id];PROFILE=id;renderTeam();openTab("team");$("#team").scrollTop=0;
 const fk=a.wing?(WING_OPEN?"Expansion Wing":"Launch Wing"):{data:"Fixtures & Data",model:"Modelling",valid:"Validation",lead:"Chief of Staff",board:"Daily Board",eng:"Engineering"}[a.d];if(fk&&!a.p.away)focus(fk)}
async function loadGH(){try{const d=await J("activity.json");
 const PR=d.prs||[];ACT_PRS=PR;$("#gh").innerHTML=`<div class="k">Agent development work</div>`+(PR.length?PR.map(p=>`<div class="row"><b style="color:${AG[p.owner]?DEPT[AG[p.owner].d].c:"var(--acc)"}">${(AG[p.owner]||{}).name||p.owner}</b> · <a href="${p.url}" target="_blank" rel="noopener">#${p.n} ${p.title.replace(/^\[[^\]]*\]\s*/,"")}</a><br><small style="color:${p.status==="shipped"?"var(--good)":"var(--mut)"}">${p.status} · opened ${fmt(p.opened)}</small></div>`).join(""):`<div class="row" style="color:var(--mut)">No pull requests yet. Agents start work at 07:30 UK once the Claude key is added to footyalmanac.</div>`)+`<div class="k" style="margin-top:16px">Recent commits · footyalmanac</div>`+d.commits.map(c=>`<div class="row"><a href="${c.url}" target="_blank" rel="noopener">${c.msg}</a><br><small style="color:var(--mut)" class="mono">${c.sha} · ${fmt(c.date)}</small></div>`).join("")+`<div class="k" style="margin-top:16px">Workflow runs</div>`+d.runs.map(r=>`<div class="row"><span style="color:${r.conclusion==="success"?"var(--good)":r.conclusion==="failure"?"var(--bad)":"var(--mut)"}">●</span> ${r.name} · ${fmt(r.createdAt)}</div>`).join("")}catch(e){$("#gh").innerHTML="<p class='k'>Couldn't reach GitHub right now.</p>"}}

/* ---------- chit-chat ---------- */
function chatScripts(){const s=STATS||{},o=LASTSU?.objectives||[],top=(s.top||[])[0],wk=(s.weak||[])[0],t=(s.tiers||[]),strong=t.find(x=>x.name==="Strong"),lean=t.find(x=>x.name==="Lean");
 const behind=o.filter(x=>x.status!=="on track");const star=AG[LASTSU?.star];
 return [
  [["Daily List is sitting at "+pct(s.listAcc)+". 70% is in reach."],["Let's get there. I'll flag any shaky Strong picks before 04:00."]],
  wk&&[[`${wk.name} is still our weak spot at ${pct(wk.acc)}.`],["I'll queue a home-advantage backtest for that league tonight."],["Send me the misses and I'll check the club matching too."]],
  lean&&[[`Lean tier is winning ${pct(lean.hit)} vs ${pct(lean.expected)} expected.`],["So we're under-confident there. Could promote some Leans to Firm."],["Worth an experiment. I'll draft it for Friday."]],
  top&&[[`Have you seen ${top.m} at ${pct(top.c)}? Biggest mismatch on the board.`],["That's exactly the best-v-worst game we're built to find."]],
  [[`${s.competitions||"All"} competitions swept this morning and zero unrated fixtures.`],["Great sweep. That makes my ratings job much easier."]],
  [[`Builds are ${s.runsOk}/${s.runsTotal} green.`],["Nice. Let's keep the pipeline ahead of the 03:00 sweep."]],
  star&&[[`Congrats on Agent of the Week, ${star.name}!`],["Thanks! Honestly it's the whole team's data that gets us there."]],
  behind.length&&[[`We've got ${behind.length} objectives not yet on track.`],[`I can help with "${behind[0].name}" — what do you need?`],["A second pair of eyes on yesterday's misses would be great."]],
  [["Tennis is a different beast — surface matters so much."],["Agreed. Surface Elo is the next thing I want to test."]],
  [["Fancy grabbing a flat white before the stand-up?"],["Always. Then let's look at the calibration bands together."]]].filter(Boolean)}
const SPOTS=["coolerN1","coolerN2","coolerS","coffee","table","aquarium"];
let chatting=0,presenting=false;
async function chitchat(){if(meetingOn||presenting||workActive||chatting>=2)return;
 const free=people.filter(p=>!p.away&&!p.busy);if(free.length<2)return;
 const a=free.splice(Math.floor(Math.random()*free.length),1)[0];const b=free.sort((x,y)=>(x.a.d===a.a.d)-(y.a.d===a.a.d))[Math.floor(Math.random()*Math.min(3,free.length))];
 const placeKey=SPOTS[Math.floor(Math.random()*SPOTS.length)];const pl=PLACES[placeKey];const scripts=chatScripts();const sc=scripts[Math.floor(Math.random()*scripts.length)];
 chatting++;const ra=routeTo(a.a,pl,pl.spots[0]),rb=routeTo(b.a,pl,pl.spots[1]);
 const faceA=Math.atan2(pl.spots[1][0]-pl.spots[0][0],pl.spots[1][1]-pl.spots[0][1]);
 const drink=placeKey.startsWith("cooler")||placeKey==="coffee";
 await Promise.all([go(a,ra,faceA,"stand"),new Promise(r=>setTimeout(r,500)).then(()=>go(b,rb,faceA+Math.PI,"stand"))]);
 if(drink){a.cup.visible=b.cup.visible=true}
 const lines=[];for(let i=0;i<sc.length;i++){const sp=i%2?b:a;lines.push({a:sp.a.id,t:sc[i][0]});if(meetingOn)break;await say(sp,`<b style="color:${DEPT[sp.a.d].c}">${sp.a.name}</b>${sc[i][0]}`,3800,true)}
 LOCALCHATS.unshift({time:new Date().toISOString(),spot:pl.label,lines});LOCALCHATS=LOCALCHATS.slice(0,20);loadChats();
 a.cup.visible=b.cup.visible=false;await Promise.all([goHome(a,ra),goHome(b,rb)]);chatting--}
setInterval(()=>{if(Math.random()<.75)chitchat()},14000);
async function everyoneHome(){for(let i=0;i<80&&people.some(p=>p.away);i++)await sleep(300)}

/* ---------- stand-up choreography ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function play(s,replay){if(meetingOn||presenting)return;meetingOn=true;const b=$("#banner");b.style.display="block";b.textContent=(replay?"Replaying stand-up · ":"Stand-up · ")+"everyone to the stand-up room";
 BUBBLES.forEach(el=>el.remove());BUBBLES.clear();await everyoneHome();focus("Stand-up room");
 const order=[...new Set(s.lines.map(l=>l.agent))];const seatFor={};const OTHER=[...SEATS.slice(0,10),...SEATS.slice(11)];let k=0;order.forEach(id=>{seatFor[id]=id==="chief"?SEATS[10]:OTHER[(k++)%OTHER.length]});people.forEach(p=>{if(!seatFor[p.a.id])seatFor[p.a.id]=OTHER[(k++)%OTHER.length]});
 const routes={};await Promise.all(people.map(p=>{const st=seatFor[p.a.id];routes[p.a.id]=routeToMeeting(p.a,st);return sleep(Math.random()*700).then(()=>go(p,routes[p.a.id],st[2],"sit"))}));
 openTab("log");$("#log").innerHTML=`<div class="k" style="margin-bottom:10px">${fmt(s.time)} · ${replay?"replay":s.trigger} · live</div>`;
 for(const l of s.lines){const p=AG[l.agent].p;SPEAKER=l.agent;screens.meet.redraw(paintMeeting);
  const txt=l.kudos?`${l.yesterday}`:`${l.yesterday}<br><span style="color:#7a6650">Next:</span> ${l.today}`;
  $("#log").insertAdjacentHTML("beforeend",line(l,true));$("#log").lastElementChild.scrollIntoView({behavior:"smooth",block:"end"});
  b.textContent=`Stand-up · ${p.a.name} (${p.a.role}) speaking`;await say(p,`<b style="color:${DEPT[p.a.d].c}">${p.a.name} · ${p.a.role}</b>${txt}`,5200);$("#log").lastElementChild.classList.remove("now")}
 if(s.star){const st=AG[s.star].p;b.textContent=`Round of applause for ${AG[s.star].name}`;await Promise.all(people.filter(p=>p!==st).slice(0,4).map((p,i)=>say(p,["Great work!","Well done!","Brilliant, thanks!","Nice one!"][i],2200,true)))}
 SPEAKER=null;screens.meet.redraw(paintMeeting);b.textContent="Stand-up complete · back to desks";
 await Promise.all(people.map(p=>sleep(Math.random()*700).then(()=>goHome(p,routes[p.a.id]))));
 meetingOn=false;b.style.display="none";poll(true)}
async function present(){if(meetingOn||presenting)return;if(!REPORT)return;presenting=true;meetingOn=true;const b=$("#banner");b.style.display="block";b.textContent="Business playback · everyone to the Playback Lounge";
 BUBBLES.forEach(el=>el.remove());BUBBLES.clear();await everyoneHome();focus("Playback Lounge");
 const routes={};const audience=people.filter(p=>p.a.id!=="chief");const chief=AG.chief.p;
 routes.chief=routeTo(chief.a,PLACES.lounge,[6.4,15.2]);
 await Promise.all([go(chief,routes.chief,Math.PI/2,"stand"),...audience.map((p,i)=>{const st=LSEATS[i%LSEATS.length];const ax=st[0]<10?10.3:st[0]<13?12.9:15.3;routes[p.a.id]=routeTo(p.a,{corr:"S",x:ax,inner:[[ax,12.6],[ax,st[1]]]},[st[0],st[1]]);return sleep(i*250).then(()=>go(p,routes[p.a.id],st[2],"sit"))})]);
 openTab("pb");const r=REPORT;const star=AG[r.star];
 const script={cover:`Welcome to the ${r.period==="week"?"weekly":"daily"} playback. Daily List is at ${pct(r.stats.listAcc)}, overall ${pct(r.stats.overallAcc)}.`,
  objectives:`${r.objectives.filter(o=>o.status==="on track").length} of ${r.objectives.length} objectives on track. Owners, this is our scoreboard.`,
  wins:`What went well: ${r.wins[0]||"steady day"}${r.wins.length>1?` and ${r.wins.length-1} more Daily List hits`:""}.`,
  lessons:`What we learned: ${r.lessons[0]||"nothing major"}. Let's own these together.`,
  shout:star?`Shout-out to ${star.name} — furthest ahead of target. Agent of the Week!`:"Thanks everyone.",
  next:`Next focus: ${(r.next[0]||"keep it up").replace(/ — \w+$/,"")}. Help each other get there.`};
 for(const sl of ["cover",...SLIDES]){SLIDE=sl;screens.playback.redraw(paintPlayback);b.textContent=`Playback · ${sl==="cover"?"overview":sl}`;await say(chief,`<b style="color:${DEPT.lead.c}">Luke · Chief of Staff</b>${script[sl]}`,5600);
  if(sl==="shout"&&star){await say(star.p,"Thank you! Couldn't do it without the data team.",2600,true)}
  if(sl==="lessons"){const e=AG.experiment.p;await say(e,"I'll turn that into tonight's experiment.",2600,true)}}
 SLIDE=null;screens.playback.redraw(paintPlayback);b.textContent="Playback complete · back to work";
 await Promise.all(people.map(p=>sleep(Math.random()*700).then(()=>goHome(p,routes[p.a.id]))));
 presenting=false;meetingOn=false;b.style.display="none"}

let lastId=null;
async function poll(quiet){try{const l=await J("standups.json");if(!meetingOn)renderLog(l);else{HISTORY=l;renderTeam()}renderAcc(l[0]);
 if(!quiet&&lastId!==null&&l[0]&&l[0].id!==lastId)play(l[0]);lastId=l[0]?l[0].id:0;$("#foot").innerHTML=`Last stand-up ${l[0]?fmt(l[0].time):"–"} · runs on GitHub Actions · <a href="${RUN_URL}" target="_blank" rel="noopener" style="color:var(--acc)">run one now</a>`}catch(e){$("#foot").textContent="Could not load office data · showing last known state"}}
$("#go").onclick=async e=>{const btn=e.target;if(!HISTORY[0])return;btn.disabled=true;btn.textContent="In session";try{await play(HISTORY[0],true)}finally{btn.disabled=false;btn.textContent="Call stand-up"}};
$("#present").onclick=()=>present();
document.fonts.ready.then(async()=>{rhythmTick();await poll(true);loadReports();loadChats();loadGH()});
J("rhythm.json").then(d=>{if(d.rhythm)RHYTHM=d.rhythm;rhythmTick()}).catch(()=>{});
setInterval(()=>poll(false),20000);setInterval(loadGH,180000);setInterval(loadReports,120000);setInterval(loadChats,60000);
setTimeout(chitchat,4000);loadEvents();setInterval(loadEvents,120000);loadPicks().then(()=>{loadSlip();loadBrief()});setInterval(()=>{loadSlip();loadBrief()},120000);setInterval(()=>J("picks.json").then(d=>{PICKS=d;renderBoard()}).catch(()=>{}),600000);if(matchMedia("(max-width:980px)").matches)$("#board").classList.add("min");
</script></body></html>
